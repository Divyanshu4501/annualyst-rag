<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annualyst</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --accent: #1f5f8b; --accent-soft: #e8f0f6; --ok: #2e7d4f; --warn: #a15c00; --warn-soft: #fdf3e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1d1d1b; --text: #ecece8; --muted: #9c9c95; --line: #33332f;
      --accent: #7fb3d9; --accent-soft: #1f2a33; --ok: #6fcf97; --warn: #f2b45c; --warn-soft: #2e261a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 4px 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  select, textarea, button { font: inherit; color: inherit; }
  select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line);
                     border-radius: 8px; padding: 10px 12px; }
  textarea { resize: vertical; min-height: 72px; margin-top: 12px; }
  select.attention { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
                   padding: 10px 18px; cursor: pointer; font-weight: 600; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  .chip { background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px;
          padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .hint { color: var(--muted); font-size: 13px; }
  #result { margin-top: 20px; display: none; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px;
           border-radius: 999px; margin-bottom: 10px; }
  .badge.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .badge.no { background: var(--warn-soft); color: var(--warn); }
  .answer { font-size: 18px; white-space: pre-wrap; }
  h2 { font-size: 14px; color: var(--muted); margin: 20px 0 8px; font-weight: 600;
       text-transform: uppercase; letter-spacing: .04em; }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  summary { cursor: pointer; font-weight: 600; }
  .snippet { color: var(--muted); font-size: 14px; margin-top: 6px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .error { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Annualyst</h1>
  <p class="sub">Ask questions about eight Indian FY2025-26 annual reports. Every answer cites its page.</p>

  <div class="card">
    <label for="company">Company</label>
    <select id="company"><option value="">Auto-detect from the question</option></select>
    <textarea id="question" placeholder="e.g. What was HDFC Bank's standalone net profit in FY26?"></textarea>
    <div class="row">
      <button class="primary" id="ask">Ask</button>
      <span class="hint">Enter to ask · Shift+Enter for a new line</span>
    </div>
    <div class="row" id="examples"></div>
  </div>

  <div class="card" id="result">
    <span class="badge" id="badge"></span>
    <div class="answer" id="answer"></div>
    <div id="sources-wrap"><h2>Sources</h2><div id="sources"></div></div>
    <div class="meta" id="meta"></div>
  </div>
</main>

<script>
const EXAMPLES = [
  "What was HDFC Bank's standalone net profit in FY26?",
  "What was Zomato's GOV growth in FY26?",
  "What was Titan's jewellery revenue in FY26?",
];
const $ = (id) => document.getElementById(id);

async function loadCompanies() {
  const res = await fetch("/companies");
  for (const c of await res.json()) {
    const o = document.createElement("option");
    o.value = c.slug; o.textContent = c.name;
    $("company").appendChild(o);
  }
}

function addExamples() {
  for (const q of EXAMPLES) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = q;
    b.onclick = () => { $("question").value = q; ask(); };
    $("examples").appendChild(b);
  }
}

function show(r) {
  $("result").style.display = "block";
  $("company").classList.toggle("attention", r.reason === "no_company");
  const badge = $("badge");
  badge.className = "badge " + (r.found ? "ok" : "no");
  badge.textContent = r.found ? "Answer found"
    : r.reason === "no_company" ? "Pick a company" : "Not found in the reports";
  $("answer").textContent = r.answer;

  const src = $("sources");
  src.innerHTML = "";
  $("sources-wrap").style.display = r.sources.length ? "block" : "none";
  for (const s of r.sources) {
    const d = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = `${s.company_name} · p.${s.page}`;
    const p = document.createElement("div");
    p.className = "snippet"; p.textContent = s.snippet + " …";
    d.append(sum, p);
    src.appendChild(d);
  }
  const t = r.timings, tk = r.tokens;
  $("meta").textContent = `${(t.total_s ?? 0).toFixed(2)} s` +
    (t.llm_s !== undefined ? ` (LLM ${t.llm_s.toFixed(2)} s)` : "") +
    ` · ${tk.prompt_tokens + tk.completion_tokens} tokens · ≈ $${r.cost_usd.toFixed(5)}` +
    (r.companies.length ? ` · searched: ${r.companies.join(", ")}` : "");
}

async function ask() {
  const question = $("question").value.trim();
  if (question.length < 3) return;
  const btn = $("ask");
  btn.disabled = true; btn.textContent = "Thinking…";
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, company: $("company").value || null }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    show(await res.json());
  } catch (e) {
    $("result").style.display = "block";
    $("badge").className = "badge no"; $("badge").textContent = "Error";
    $("answer").innerHTML = "";
    const span = document.createElement("span");
    span.className = "error"; span.textContent = String(e.message || e);
    $("answer").appendChild(span);
    $("sources-wrap").style.display = "none"; $("meta").textContent = "";
  } finally {
    btn.disabled = false; btn.textContent = "Ask";
  }
}

$("ask").onclick = ask;
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
$("company").onchange = () => $("company").classList.remove("attention");
loadCompanies(); addExamples();
</script>
</body>
</html>
